<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&lt;3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#000}
body{display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;aspect-ratio:8/7;background:#000}
</style>
</head>
<body>
<canvas id="c" width="800" height="700"></canvas>
<script>
const W=800,H=700,CX=400,CY=360,SC=260;
const ctx=document.getElementById('c').getContext('2d');
const P=[];
const rnd=Math.random;
function add(bx,by,r,g,b,a,heart){P.push({x:rnd()*W,y:rnd()*H,bx,by,c:`rgba(${r},${g},${b},${a})`,heart});}

// heart outline
for(let i=0;i<5000;i++){
  const t=rnd()*Math.PI*2;
  const hx=16*Math.pow(Math.sin(t),3);
  const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  const k=1-rnd()*0.05,u=rnd();
  add(CX+hx*16.5*k,CY-20-hy*16.5*k,255,Math.round(60+80*u),Math.round(130+60*u),1,true);
}
// soft fill
for(let i=0;i<2500;){
  const x=rnd()*2.4-1.2,y=rnd()*2.4-1.1,a=x*x+y*y-1;
  if(a*a*a-x*x*y*y*y<=0){add(CX+x*SC,CY-y*SC,255,90,150,0.35,true);i++;}
}
// text sampled from an offscreen canvas
function addLine(txt,cy){
  const o=document.createElement('canvas');o.width=W;o.height=100;
  const c=o.getContext('2d');
  c.fillStyle='#fff';c.font='bold 46px Arial, Helvetica, sans-serif';
  c.textAlign='center';c.textBaseline='middle';c.fillText(txt,W/2,50);
  const d=c.getImageData(0,0,W,100).data;
  for(let y=0;y<100;y+=2)for(let x=0;x<W;x+=2)
    if(d[(y*W+x)*4+3]>128)add(x,cy-50+y,255,255,255,1,false);
}
addLine('MINT YH',CY-45);
addLine('MAKES ME HARD',CY+25);

function frame(ms){
  const tm=ms*0.001;
  const beat=1+0.035*Math.pow(Math.max(0,Math.sin(tm*4)),4);
  ctx.fillStyle='rgba(0,0,0,0.24)';ctx.fillRect(0,0,W,H);
  for(let i=0;i<P.length;i++){
    const p=P[i];
    let tx=p.bx,ty=p.by;
    if(p.heart){tx=CX+(p.bx-CX)*beat;ty=CY+(p.by-CY)*beat;}
    p.x+=(tx-p.x)*0.06;p.y+=(ty-p.y)*0.06;
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x+Math.sin(tm*3+i)*0.7,p.y+Math.cos(tm*3+i)*0.7,1.6,1.6);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
